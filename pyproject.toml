[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-to-ticket"
version = "0.1.0"
description = "Draft a structured bug ticket from a screenshot with a local vision model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "screenshot-to-ticket contributors" }]
keywords = ["screenshot", "bug-ticket", "ollama", "cli", "vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
  "httpx>=0.27",
  "pillow>=10",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shot-ticket = "shot_ticket.cli:main"

[project.urls]
Homepage = "https://github.com/SilverBomb-Gaming/screenshot-to-ticket"
Repository = "https://github.com/SilverBomb-Gaming/screenshot-to-ticket"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
